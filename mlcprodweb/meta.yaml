id: "mlcssystray"
name: "MLC SSH Tray Agent"
version: "0.1.2"
status: "beta"
category: "Infrastructure"
categories: ["Desktop Apps & Tools"]
license: "MIT"
platforms: ["Windows"]
source: "https://github.com/hmsoft0815/mlcssystray"
slogan_en: "Small Windows tray icon that shows who is connected to this PC right now — SSH, RDP and WSL sessions, with a notification when a new one appears."
slogan_de: "Kleines Windows-Tray-Symbol, das zeigt, wer gerade mit diesem PC verbunden ist – SSH-, RDP- und WSL-Sitzungen, mit Hinweis bei jeder neuen Verbindung."
screenshots:
  - "ssh-tray-agent-hero.jpg"
downloads:
  free: true
  note_en: "Free download, no account needed. MIT licensed, source on GitHub."
  note_de: "Kostenloser Download, kein Konto nötig. MIT-Lizenz, Quellcode auf GitHub."
  notices:
    - type: "warning"
      en: "<b>Windows warns on first run.</b> The installer is not code-signed yet, so SmartScreen shows “Windows protected your PC”. Click <i>More info</i> → <i>Run anyway</i>."
      de: "<b>Windows warnt beim ersten Start.</b> Der Installer ist noch nicht signiert, deshalb meldet SmartScreen „Der Computer wurde durch Windows geschützt“. Auf <i>Weitere Informationen</i> → <i>Trotzdem ausführen</i> klicken."
    - type: "tip"
      en: "<b>Installer or portable?</b> The installer needs no administrator rights and can start the agent at sign-in. The portable .exe runs as is; put a shortcut into <code>shell:startup</code> to start it automatically."
      de: "<b>Installer oder portabel?</b> Der Installer braucht keine Administratorrechte und kann den Agenten bei der Anmeldung starten. Die portable .exe läuft direkt; für den Autostart eine Verknüpfung in <code>shell:startup</code> legen."
  files:
    - os: "Windows"
      arch: "x64"
      label_en: "Windows Installer (x64)"
      label_de: "Windows-Installer (x64)"
      file: "https://github.com/hmsoft0815/mlcssystray/releases/download/v0.1.2/mlcsshtrayagent-setup-x64.exe"
    - os: "Windows"
      arch: "ARM64"
      label_en: "Windows Installer (ARM64)"
      label_de: "Windows-Installer (ARM64)"
      file: "https://github.com/hmsoft0815/mlcssystray/releases/download/v0.1.2/mlcsshtrayagent-setup-arm64.exe"
    - os: "Windows"
      arch: "x64"
      label_en: "Portable .exe (x64)"
      label_de: "Portable .exe (x64)"
      file: "https://github.com/hmsoft0815/mlcssystray/releases/download/v0.1.2/mlcsshtrayagent-windows-amd64.exe"
    - os: "Windows"
      arch: "ARM64"
      label_en: "Portable .exe (ARM64)"
      label_de: "Portable .exe (ARM64)"
      file: "https://github.com/hmsoft0815/mlcssystray/releases/download/v0.1.2/mlcsshtrayagent-windows-arm64.exe"
features:
  - icon: "terminal"
    title_en: "SSH, RDP and WSL"
    title_de: "SSH, RDP und WSL"
    desc_en: "Shows Windows OpenSSH, Remote Desktop and WSL SSH sessions with user, source and duration."
    desc_de: "Zeigt Windows-OpenSSH-, Remotedesktop- und WSL-SSH-Sitzungen mit Benutzer, Herkunft und Dauer."
  - icon: "bell"
    title_en: "Notice new connections"
    title_de: "Neue Verbindungen bemerken"
    desc_en: "A desktop notification appears as soon as someone connects."
    desc_de: "Sobald sich jemand verbindet, erscheint eine Desktop-Benachrichtigung."
  - icon: "languages"
    title_en: "German and English"
    title_de: "Deutsch und Englisch"
    desc_en: "Follows the Windows display language and light/dark theme."
    desc_de: "Folgt der Windows-Anzeigesprache und dem hellen oder dunklen Design."
