name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            output: mlcsshtrayagent-windows-amd64.exe
          - goarch: arm64
            output: mlcsshtrayagent-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: mkdir -p dist
      - run: VERSION="${GITHUB_REF_NAME#v}"; GOOS=windows GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -ldflags "-H=windowsgui -X github.com/mlc911/mlcsshtrayagent/internal/app.Version=$VERSION" -o "dist/${{ matrix.output }}" ./cmd/mlcsshtrayagent
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.output }}
          generate_release_notes: true