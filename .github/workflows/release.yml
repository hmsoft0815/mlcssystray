name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            installer_arch: x64
            allowed_architectures: x64compatible
            install_mode_architecture: x64
          - goarch: arm64
            installer_arch: arm64
            allowed_architectures: arm64
            install_mode_architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build executable and installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $goarch = '${{ matrix.goarch }}'
          $dist = Join-Path $PWD.Path 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $dist "mlcsshtrayagent-windows-$goarch.exe"

          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch $goarch --out cmd/mlcsshtrayagent/rsrc `
            --icon internal/app/assets/app.ico --manifest none `
            --product-version $version --file-version $version `
            --product-name 'MLC SSH Tray Agent' --file-description 'MLC SSH Tray Agent' `
            --copyright 'Copyright Michael Lechner' --original-filename mlcsshtrayagent.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:GOOS = 'windows'
          $env:GOARCH = $goarch
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-H=windowsgui -X github.com/mlc911/mlcsshtrayagent/internal/app.Version=$version" -o $exe ./cmd/mlcsshtrayagent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DAppVersion=$version" `
            "/DInstallerArch=${{ matrix.installer_arch }}" `
            "/DAllowedArchitectures=${{ matrix.allowed_architectures }}" `
            "/DInstallModeArchitecture=${{ matrix.install_mode_architecture }}" `
            "/DSourceExe=$exe" `
            "/DOutputDir=$dist" `
            'installer\mlcsshtrayagent.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true